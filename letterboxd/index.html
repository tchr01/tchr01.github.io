<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterboxd List Viewer</title>

  <!-- React and Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    #root {
      width: 100%;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header-subtitle {
      font-size: 14px;
      color: #999;
      margin-top: 5px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 10px 20px;
      background: #1f77d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1563b8;
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      border-radius: 8px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .modal h2 {
      font-size: 22px;
      margin-bottom: 10px;
      text-align: center;
    }

    .modal-subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1f77d2;
      box-shadow: 0 0 0 3px rgba(31, 119, 210, 0.1);
    }

    .form-hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    .form-hint a {
      color: #1f77d2;
      text-decoration: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .modal-actions button {
      flex: 1;
    }

    .btn-secondary {
      background: #eee;
      color: #333;
    }

    .btn-secondary:hover {
      background: #ddd;
    }

    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 20px;
      text-align: center;
    }

    .error-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
      max-width: 500px;
      line-height: 1.5;
    }

    .error-code {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      margin: 20px 0;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #1f77d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      color: #666;
      margin-bottom: 10px;
    }

    .progress-container {
      width: 100%;
      max-width: 300px;
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #1f77d2;
      transition: width 0.3s;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }

    @media (max-width: 1200px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 18px;
      }
    }

    @media (max-width: 768px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
      }
    }

    @media (max-width: 480px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
      }
    }

    .movie-card {
      position: relative;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      overflow: hidden;
      background: #e0e0e0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .movie-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
      color: #999;
      font-size: 30px;
    }

    .movie-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      color: white;
      padding: 30px 12px 12px;
      font-size: 12px;
      max-height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .movie-card:hover .movie-info {
      opacity: 1;
    }

    .movie-title {
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .genre-tag {
      background: rgba(255, 255, 255, 0.3);
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 10px;
      white-space: nowrap;
    }

    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .stats {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .search-box {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .search-box input:focus {
      outline: none;
      border-color: #1f77d2;
      box-shadow: 0 0 0 3px rgba(31, 119, 210, 0.1);
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .no-results-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .no-results-text {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .no-results-hint {
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // Utility functions
    const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000; // 7 days

    function getCachedData(key) {
      try {
        const item = localStorage.getItem(key);
        if (!item) return null;

        const data = JSON.parse(item);
        if (Date.now() - data.timestamp > CACHE_DURATION) {
          localStorage.removeItem(key);
          return null;
        }
        return data.value;
      } catch (e) {
        return null;
      }
    }

    function setCachedData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify({
          value,
          timestamp: Date.now()
        }));
      } catch (e) {
        console.warn('Could not save to localStorage:', e.message);
      }
    }

    function clearCache() {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('tmdb_')) {
          keys.push(key);
        }
      }
      keys.forEach(key => localStorage.removeItem(key));
    }

    // ConfigModal Component
    function ConfigModal({ onSave, show }) {
      const [apiKey, setApiKey] = useState('');
      const [error, setError] = useState('');

      const handleSave = () => {
        if (!apiKey.trim()) {
          setError('API key is required');
          return;
        }
        if (apiKey.length < 20) {
          setError('API key looks invalid (too short)');
          return;
        }
        localStorage.setItem('tmdb_api_key', apiKey);
        onSave(apiKey);
      };

      if (!show) return null;

      return (
        <div className="modal-overlay">
          <div className="modal">
            <h2>🎬 Setup TMDb API</h2>
            <p className="modal-subtitle">Get movie posters and genres</p>

            <div className="form-group">
              <label>API Key</label>
              <input
                type="password"
                placeholder="Enter your TMDb API key"
                value={apiKey}
                onChange={(e) => {
                  setApiKey(e.target.value);
                  setError('');
                }}
                onKeyPress={(e) => e.key === 'Enter' && handleSave()}
              />
              <div className="form-hint">
                Get a free API key at{' '}
                <a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener noreferrer">
                  themoviedb.org
                </a>
              </div>
              {error && <div style={{ color: '#e74c3c', marginTop: '8px', fontSize: '12px' }}>{error}</div>}
            </div>

            <div className="modal-actions">
              <button className="btn" onClick={handleSave}>
                Save & Continue
              </button>
            </div>
          </div>
        </div>
      );
    }

    // LoadingState Component
    function LoadingState({ phase, progress }) {
      const phaseText = {
        'loading-json': 'Loading movies.json...',
        'loading-tmdb': `Enriching with TMDb data... (${progress.current}/${progress.total})`
      };

      return (
        <div className="loading-container">
          <div className="spinner"></div>
          <p className="loading-text">{phaseText[phase] || 'Loading...'}</p>
          {progress.total > 0 && (
            <div className="progress-container">
              <div className="progress-bar">
                <div
                  className="progress-fill"
                  style={{
                    width: `${Math.round((progress.current / progress.total) * 100)}%`
                  }}
                />
              </div>
              <div className="progress-text">
                {progress.current} / {progress.total}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ErrorState Component
    function ErrorState({ error, onRetry }) {
      let icon = '❌';
      let title = 'Error';
      let message = error;

      if (error.includes('movies.json')) {
        icon = '📂';
        title = 'Missing movies.json';
        message = 'Run the scraper first to create movies.json:\n\nnpm install\nnode scraper.js';
      } else if (error.includes('API')) {
        icon = '🔑';
        title = 'API Error';
      }

      return (
        <div className="error-container">
          <div className="error-icon">{icon}</div>
          <div className="error-title">{title}</div>
          <div className="error-message">{message}</div>
          {onRetry && (
            <button className="btn" onClick={onRetry}>
              Retry
            </button>
          )}
        </div>
      );
    }

    // MovieCard Component
    function MovieCard({ movie, onClick }) {
      return (
        <div className="movie-card" onClick={() => onClick(movie)}>
          {movie.posterUrl ? (
            <>
              <img src={movie.posterUrl} alt={movie.title} className="movie-poster" />
              {movie.genres && movie.genres.length > 0 && (
                <div className="movie-info">
                  <div className="movie-title">{movie.title}</div>
                  <div className="movie-genres">
                    {movie.genres.slice(0, 3).map((genre, i) => (
                      <span key={i} className="genre-tag">{genre}</span>
                    ))}
                    {movie.genres.length > 3 && (
                      <span className="genre-tag">+{movie.genres.length - 3}</span>
                    )}
                  </div>
                </div>
              )}
            </>
          ) : (
            <div className="movie-placeholder">🎞️</div>
          )}
        </div>
      );
    }

    // MovieGrid Component
    function MovieGrid({ movies, onMovieClick }) {
      const [searchTerm, setSearchTerm] = useState('');

      const filteredMovies = useMemo(() => {
        if (!searchTerm) return movies;
        return movies.filter(m =>
          m.title.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [movies, searchTerm]);

      return (
        <>
          <div className="search-box">
            <input
              type="text"
              placeholder="Search movies..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
            />
          </div>

          {filteredMovies.length === 0 ? (
            <div className="no-results">
              <div className="no-results-icon">🔍</div>
              <div className="no-results-text">No movies found</div>
              <div className="no-results-hint">Try a different search term</div>
            </div>
          ) : (
            <>
              <div className="movie-grid">
                {filteredMovies.map((movie, idx) => (
                  <MovieCard key={idx} movie={movie} onClick={onMovieClick} />
                ))}
              </div>
              <div className="stats">
                Showing {filteredMovies.length} of {movies.length} movies
              </div>
            </>
          )}
        </>
      );
    }

    // Main App Component
    function App() {
      const [movies, setMovies] = useState([]);
      const [enrichedMovies, setEnrichedMovies] = useState({});
      const [genres, setGenres] = useState({});
      const [state, setState] = useState('init'); // init, loading-json, loading-tmdb, ready, error
      const [error, setError] = useState('');
      const [apiKey, setApiKey] = useState(localStorage.getItem('tmdb_api_key') || '');
      const [progress, setProgress] = useState({ current: 0, total: 0 });

      // Load movies.json on mount
      useEffect(() => {
        loadMoviesJson();
      }, []);

      async function loadMoviesJson() {
        try {
          setState('loading-json');
          setError('');
          const response = await fetch('./movies.json');

          if (!response.ok) {
            throw new Error('movies.json not found. Run: npm install && node scraper.js');
          }

          const data = await response.json();
          if (!Array.isArray(data)) {
            throw new Error('Invalid movies.json format');
          }

          setMovies(data);
          setProgress({ current: 0, total: data.length });

          // Start enriching with TMDb data
          if (apiKey) {
            enrichMoviesWithTMDb(data);
          } else {
            setState('ready');
          }
        } catch (err) {
          setError(err.message);
          setState('error');
        }
      }

      async function enrichMoviesWithTMDb(moviesToEnrich) {
        try {
          setState('loading-tmdb');

          // Fetch genre list first
          const genreList = await fetchGenreList();
          setGenres(genreList);

          const enriched = { ...enrichedMovies };
          let processed = 0;

          // Batch processing (10 concurrent)
          const batchSize = 10;
          for (let i = 0; i < moviesToEnrich.length; i += batchSize) {
            const batch = moviesToEnrich.slice(i, i + batchSize);
            const promises = batch.map(movie =>
              fetchTMDbData(movie, genreList).then(data => {
                enriched[movie.letterboxdUrl] = data;
                processed++;
                setProgress({ current: processed, total: moviesToEnrich.length });
              }).catch(() => {
                // Silently fail for individual movies
                processed++;
                setProgress({ current: processed, total: moviesToEnrich.length });
              })
            );

            await Promise.all(promises);

            // Add delay between batches
            if (i + batchSize < moviesToEnrich.length) {
              await new Promise(r => setTimeout(r, 250));
            }
          }

          setEnrichedMovies(enriched);
          setState('ready');
        } catch (err) {
          setError(err.message);
          setState('error');
        }
      }

      async function fetchGenreList() {
        // Check cache first
        const cached = getCachedData('tmdb_genres');
        if (cached) return cached;

        const response = await fetch(
          `https://api.themoviedb.org/3/genre/movie/list?api_key=${apiKey}`
        );

        if (!response.ok) throw new Error('Failed to fetch genres');

        const data = await response.json();
        const genreMap = {};
        data.genres.forEach(g => {
          genreMap[g.id] = g.name;
        });

        setCachedData('tmdb_genres', genreMap);
        return genreMap;
      }

      async function fetchTMDbData(movie, genreList) {
        // Check cache first
        const cacheKey = `tmdb_${movie.letterboxdUrl}`;
        const cached = getCachedData(cacheKey);
        if (cached) return cached;

        // Fetch from TMDb
        const query = new URLSearchParams({
          api_key: apiKey,
          query: movie.title,
          ...(movie.year && { year: movie.year })
        });

        const response = await fetch(
          `https://api.themoviedb.org/3/search/movie?${query}`
        );

        if (!response.ok) throw new Error('TMDb API error');

        const data = await response.json();
        if (!data.results || data.results.length === 0) {
          return { posterUrl: null, genres: [] };
        }

        const tmdbMovie = data.results[0];
        const posterUrl = tmdbMovie.poster_path
          ? `https://image.tmdb.org/t/p/w200${tmdbMovie.poster_path}`
          : null;

        // Map genre IDs to genre names
        const genreNames = (tmdbMovie.genre_ids || []).map(id => genreList[id]).filter(Boolean);

        const result = {
          posterUrl,
          genres: genreNames
        };

        setCachedData(cacheKey, result);
        return result;
      }

      function handleMovieClick(movie) {
        window.open(movie.letterboxdUrl, '_blank');
      }

      function handleRefresh() {
        clearCache();
        setEnrichedMovies({});
        if (apiKey) {
          enrichMoviesWithTMDb(movies);
        }
      }

      function handleSettingsClick() {
        setApiKey('');
        setState('init');
      }

      const displayMovies = movies.map(movie => ({
        ...movie,
        ...enrichedMovies[movie.letterboxdUrl]
      }));

      return (
        <div className="container">
          <ConfigModal show={!apiKey} onSave={(key) => {
            setApiKey(key);
            enrichMoviesWithTMDb(movies);
          }} />

          {state === 'error' && (
            <ErrorState error={error} onRetry={loadMoviesJson} />
          )}

          {state !== 'error' && (
            <>
              <div className="header">
                <div>
                  <h1>🎬 Your Movies</h1>
                  <div className="header-subtitle">
                    {movies.length} movies from Letterboxd
                  </div>
                </div>
                <div className="header-actions">
                  {state === 'ready' && movies.length > 0 && (
                    <>
                      <button className="btn btn-small" onClick={handleRefresh}>
                        🔄 Refresh
                      </button>
                      <button className="btn-icon" onClick={handleSettingsClick}>
                        ⚙️
                      </button>
                    </>
                  )}
                </div>
              </div>

              {(state === 'loading-json' || state === 'loading-tmdb') && (
                <LoadingState phase={state} progress={progress} />
              )}

              {state === 'ready' && movies.length > 0 && (
                <MovieGrid movies={displayMovies} onMovieClick={handleMovieClick} />
              )}
            </>
          )}
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
