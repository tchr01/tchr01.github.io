<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Keno Live Results</title>
    <link rel="stylesheet" href="viewer-styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="images/logo.png" alt="Massachusetts Lottery" class="lottery-logo">
            <h1>MASSACHUSETTS KENO</h1>
            <div class="subtitle">LIVE RESULTS</div>
        </header>

        <!-- Rotating Banner -->
        <div class="banner-container">
            <img src="images/Keno_50th_LaborDay_Website_Promo_Page_Banner_984x290__1_.png" alt="Keno 50th Anniversary" class="banner-image active">
            <img src="images/Keno_Multiplier_Mania_24_promo_page_banner_984x290.png" alt="Keno Multiplier Mania" class="banner-image">
            <img src="images/Keno-2x-Multiplier-Make-Good_promo_page_banner_984x290.png" alt="Keno 2x Multiplier" class="banner-image">
        </div>

        <div class="main-content">
            <!-- Left: Keno Board -->
            <div class="board-section">
                <div class="keno-board" id="kenoBoard">
                    <!-- Numbers 1-80 will be generated by JavaScript -->
                </div>
            </div>

            <!-- Right: Drawn Numbers Display -->
            <div class="results-section">
                <div class="results-header">WINNING NUMBERS</div>
                <div class="drawn-numbers-grid" id="drawnNumbers">
                    <!-- Drawn numbers will appear here -->
                </div>
            </div>
        </div>

        <!-- Footer with Draw Info -->
        <footer class="footer">
            <div class="draw-info">
                <div class="info-item">
                    <span class="label">GAME NUMBER:</span>
                    <span class="value" id="gameNumber">--</span>
                </div>
                <div class="info-item">
                    <span class="label">DRAW TIME:</span>
                    <span class="value" id="drawTime">--:--:--</span>
                </div>
                <div class="info-item">
                    <span class="label">NEXT UPDATE IN:</span>
                    <span class="value countdown" id="countdown">3:00</span>
                </div>
            </div>
            <div class="status-bar" id="statusBar">
                <span class="status-indicator">●</span>
                <span id="statusText">Connecting...</span>
            </div>
        </footer>
    </div>

    <script src="viewer-script.js"></script>
</body>
</html>
