<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massachusetts Keno Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>MASSACHUSETTS KENO</h1>
            <div class="game-info">
                <div class="game-number">GAME #<span id="gameNumber">1</span></div>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Panel: Controls -->
            <div class="control-panel">
                <div class="control-section">
                    <h2>YOUR TICKET</h2>
                    <div class="selected-numbers" id="selectedNumbers">
                        <div class="no-selection">Select 1-12 numbers</div>
                    </div>
                </div>

                <div class="control-section">
                    <label for="numGames">NUMBER OF GAMES</label>
                    <input type="number" id="numGames" min="1" max="20" value="1">
                </div>

                <div class="control-section">
                    <label for="wagerAmount">WAGER PER GAME</label>
                    <select id="wagerAmount">
                        <option value="1">$1</option>
                        <option value="2">$2</option>
                        <option value="3">$3</option>
                        <option value="4">$4</option>
                        <option value="5">$5</option>
                        <option value="10">$10</option>
                        <option value="20">$20</option>
                    </select>
                </div>

                <div class="control-section">
                    <div class="total-cost">
                        <span>TOTAL COST: $<span id="totalCost">1</span></span>
                    </div>
                </div>

                <div class="control-buttons">
                    <button id="clearBtn" class="btn btn-secondary">CLEAR</button>
                    <button id="quickPickBtn" class="btn btn-secondary">QUICK PICK</button>
                    <button id="playBtn" class="btn btn-primary">PLAY</button>
                </div>

                <div class="results-section" id="resultsSection" style="display: none;">
                    <h3>RESULTS</h3>
                    <div class="matches">Matches: <span id="matchCount">0</span></div>
                    <div class="winnings">Winnings: $<span id="winAmount">0</span></div>
                </div>
            </div>

            <!-- Center: Keno Board -->
            <div class="keno-board-container">
                <div class="board-header">SELECT YOUR NUMBERS</div>
                <div class="keno-board" id="kenoBoard">
                    <!-- Numbers 1-80 will be generated by JavaScript -->
                </div>
            </div>

            <!-- Right Panel: Drawn Numbers Display -->
            <div class="drawn-panel">
                <h2>DRAWN NUMBERS</h2>
                <div class="drawn-numbers" id="drawnNumbers">
                    <!-- Drawn numbers will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
